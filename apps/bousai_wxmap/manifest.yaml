summary: JMA 5 km weather forecast map
desc: JMA weather distribution forecast on a 5 km grid until midnight of the next day. Pick weather, temperature, 3-hour rain or 3-hour snow and watch it step through the forecast around your location. Each frame has one top bar with its weekday and hour and the forecast weather and temperature from JMA's regional three-hourly forecast, and a black-outlined strip of the JMA map colours along the bottom. Map colours come from JMA and cannot be recoloured; theme, colour vision, contrast and text size apply to the bar and the location marker.
