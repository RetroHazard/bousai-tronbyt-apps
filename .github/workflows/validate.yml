name: Validate apps and documentation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PIXLET_VERSION: v0.55.0
      PIXLET_SHA256: 823a29d75bc86cd78dbae7cd0cba73f57bf5aa58f545925ae822f6e9ba82158b
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install pinned Pixlet release
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/pixlet.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/tronbyt/pixlet/releases/download/${PIXLET_VERSION}/pixlet_${PIXLET_VERSION}_linux-amd64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$PIXLET_SHA256" "$archive" | sha256sum --check
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$archive" -C "$HOME/.local/bin" pixlet
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify generated sources and documentation
        run: |
          pixlet version
          python3 tools/build.py --check
          python3 tools/gen_docs.py --check
          python3 tools/check_links.py

      # These checks make real network requests. Provider outages can fail them.
      # Restricted NIED images may be rendered transiently by pixlet check, but are
      # not saved as repository previews, logs or downloadable workflow artifacts.
      - name: Render and validate all apps
        run: python3 tools/build.py --no-render --pixlet-check

      - name: Build and validate the starter app
        run: python3 tools/build.py --examples --pixlet-check

      - name: Exercise documented configurations
        shell: bash
        run: |
          set -euo pipefail
          pixlet render apps/bousai_eew/bousai_eew.star \
            --config examples/configs/eew-sample-accessible.json -m 4 -o "$RUNNER_TEMP/eew.webp"
          pixlet render apps/bousai_tsunami/bousai_tsunami.star \
            --config examples/configs/tsunami-sample.json -m 4 -o "$RUNNER_TEMP/tsunami.webp"
          pixlet render apps/bousai_forecast/bousai_forecast.star \
            --config examples/configs/tokyo-forecast.json -m 4 -o "$RUNNER_TEMP/forecast.webp"
          test -s "$RUNNER_TEMP/eew.webp"
          test -s "$RUNNER_TEMP/tsunami.webp"
          test -s "$RUNNER_TEMP/forecast.webp"
